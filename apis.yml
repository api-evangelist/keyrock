aid: keyrock
name: Keyrock
description: >-
  Keyrock is a digital asset market maker and liquidity provider founded in Brussels in 2017 and
  now operating as a global crypto investment group. It runs in-house algorithmic and
  high-frequency trading infrastructure to supply market making, over-the-counter (OTC) trading,
  an options desk, onchain/DEX liquidity, validator services, ecosystem development and a Smart
  Beta fund to token issuers, exchanges, brokerages and institutional counterparties across 85+
  centralised and decentralised venues. Keyrock also publishes proprietary crypto, FX, commodity
  and US equity pricing into the Pyth Network oracle. Its commercial surface is bilateral rather
  than self-serve: engagements are contracted, and clients receive execution analytics and PnL
  attribution through a credentialed dashboard. As of this profiling round Keyrock publishes no
  public developer portal, API reference or machine-readable contract of any kind. The group holds
  a MiCA licence through its French entity Keyrock FR SAS and has publicly announced SOC 2 Type II
  compliance.
