note: >-
  Keyrock publishes no client SDK, because it publishes no API. The npm scope @keyrock is genuinely
  first-party — every package resolves to a repository under github.com/KeyrockEU — but all three
  are internal Node.js observability utilities (winston logging transports and a SignalFX metrics
  collector) rather than client libraries for a Keyrock service. They are recorded here as real
  first-party publications with their real currency; NO `SDKs` pointer is wired into apis.yml,
  because treating a 2018 winston transport as an API SDK would credit Keyrock with a client
  library surface it does not have. All three last published in August 2018 and none has shipped a
  release in the eight years since. Registries checked with no first-party Keyrock result: PyPI
  (`keyrock` 404; `django-keyrock` exists but is a FIWARE Keyrock Identity Manager client — a
  different, unrelated project), crates.io (0 results), Maven Central, NuGet, pkg.go.dev,
  RubyGems, Packagist. The npm scope @keyrock-dev is a DIFFERENT publisher
  (gitlab.com/charles.olson) and is not Keyrock.
